name: DOCSIS Titan API Tests

on:
  push:
    branches: [ main ]

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: newman run DOCSIS_Titan_API_Tests.postman_collection.json --env-var "base_url=https://reqres.in/api"